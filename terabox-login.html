<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login TeraBox - StreamAnime</title>
  <style>
    body { margin: 0; padding: 16px; font-family: Arial, sans-serif; }
    iframe { width: 100%; height: 667px; border: 0; }
    #status { margin: 12px 0; }
  </style>
</head>
<body>
  <h2>Hubungkan Akun TeraBox</h2>
  <p id="status">Menunggu proses otorisasi TeraBox...</p>

  <iframe
    id="terabox-frame"
    src="https://www.terabox.com/wap/outside/login?clientId=XXX"
    allow="clipboard-read; clipboard-write">
  </iframe>

  <script>
    window.addEventListener("message", function (e) {
      // Terima pesan hanya dari domain TeraBox.
      let hostname;
      try {
        hostname = new URL(e.origin).hostname;
      } catch (_) {
        return;
      }

      if (hostname !== "terabox.com" && !hostname.endsWith(".terabox.com")) {
        return;
      }

      try {
        const postData =
          typeof e.data === "string" ? JSON.parse(e.data) : e.data;

        if (!postData || postData.event !== "teraboxOauth") {
          return;
        }

        console.log("Respons OAuth TeraBox diterima:", postData);

        const authorizationCode =
          postData.code || (postData.data && postData.data.code);

        if (!authorizationCode) {
          document.getElementById("status").textContent =
            "TeraBox mengirim respons, tetapi authorization code tidak ditemukan. Periksa format respons di dokumentasi TeraBox.";
          return;
        }

        // Belum menukar code dengan token. Proses itu harus dilakukan
        // di backend aman, bukan di JavaScript publik GitHub Pages.
        console.log("Authorization code diterima. Siapkan pertukaran melalui backend aman.");

        document.getElementById("status").textContent =
          "Otorisasi diterima. Integrasi belum selesai: backend aman diperlukan untuk menukar authorization code.";

        finishAuth();
      } catch (error) {
        console.error("PostMessage error:", error);
      }
    });

    function finishAuth() {
      const iframe = document.getElementById("terabox-frame");
      if (iframe) iframe.remove();
    }
  </script>
</body>
</html>
